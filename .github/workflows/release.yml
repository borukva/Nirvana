name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Oxipng
        run: command -v oxipng || cargo install oxipng --locked

      - name: Compress PNGs
        run: oxipng -o max -s -a -r src

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --max-workers=1 --stacktrace
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mc_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          test -n "$mod_version" && test -n "$mc_version"
          gh release create "$RELEASE_TAG" build/libs/*.jar \
            --verify-tag --title "${mod_version%%+*}+$mc_version" --generate-notes
