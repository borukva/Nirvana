name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Oxipng
        run: command -v oxipng || cargo install oxipng --locked

      - name: Compress PNGs
        run: oxipng -o max -s -a -r src

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --max-workers=1 --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nirvana-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
