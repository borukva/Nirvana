name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release-title: ${{ steps.version.outputs.title }}
    steps:
      - uses: actions/checkout@v6

      - name: Read release version
        id: version
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          mc_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          test -n "$mod_version" && test -n "$mc_version"
          echo "title=${mod_version%%+*}+$mc_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Oxipng
        run: command -v oxipng || cargo install oxipng --locked

      - name: Compress PNGs
        run: oxipng -o max -s -a -r src

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --max-workers=1 --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nirvana-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Automatic GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == '26.2' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: nirvana-${{ github.sha }}
          path: artifacts

      - name: Create automatic GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_id }}
          RELEASE_TITLE: ${{ needs.build.outputs.release-title }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.jar --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --prerelease=false --latest
          else
            gh release create "$RELEASE_TAG" artifacts/*.jar \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes --latest
          fi
